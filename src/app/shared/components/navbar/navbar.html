<nav [class.bg-white/80]="isScrolled" [class.backdrop-blur-md]="isScrolled" class="fixed w-full z-50 transition-all duration-300 bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      
      <!-- Logo section -->
      <div class="flex-shrink-0 flex items-center cursor-pointer" routerLink="/">
        <div class="w-12 h-12 bg-brand-blue rounded-full flex items-center justify-center text-white font-serif font-bold text-xl mr-3 shadow-md">
          BVC
        </div>
        <div class="flex flex-col">
          <span class="font-serif font-bold text-xl text-brand-blue leading-tight tracking-wide">AKSHAR</span>
          <span class="text-xs font-sans text-brand-gold font-semibold uppercase tracking-widest">Junior College</span>
        </div>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/" class="text-slate-700 hover:text-brand-blue font-medium transition-colors cursor-pointer text-sm uppercase tracking-wider">Home</a>
        <a class="text-slate-700 hover:text-brand-blue font-medium transition-colors cursor-pointer text-sm uppercase tracking-wider">Academics</a>
        <a class="text-slate-700 hover:text-brand-blue font-medium transition-colors cursor-pointer text-sm uppercase tracking-wider">Admissions</a>
        <a class="text-slate-700 hover:text-brand-blue font-medium transition-colors cursor-pointer text-sm uppercase tracking-wider">Campus</a>
        <button class="bg-brand-blue hover:bg-brand-blue/90 text-white px-6 py-2 rounded-full font-medium transition-colors shadow-md hover:shadow-lg text-sm uppercase tracking-wider">
          Apply Now
        </button>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMobileMenu()" class="text-slate-700 hover:text-brand-blue focus:outline-none p-2">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if(!isMobileMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Panel -->
  @if(isMobileMenuOpen) {
    <div class="md:hidden bg-white border-t border-slate-100 shadow-lg absolute w-full">
      <div class="px-4 pt-2 pb-4 space-y-1 flex flex-col">
        <a routerLink="/" class="block px-3 py-3 text-base font-medium text-slate-800 hover:text-brand-blue hover:bg-slate-50 rounded-md">Home</a>
        <a class="block px-3 py-3 text-base font-medium text-slate-800 hover:text-brand-blue hover:bg-slate-50 rounded-md">Academics</a>
        <a class="block px-3 py-3 text-base font-medium text-slate-800 hover:text-brand-blue hover:bg-slate-50 rounded-md">Admissions</a>
        <a class="block px-3 py-3 text-base font-medium text-slate-800 hover:text-brand-blue hover:bg-slate-50 rounded-md">Campus</a>
        <button class="w-full mt-4 bg-brand-blue text-white px-6 py-3 rounded-full font-medium transition-colors">
          Apply Now
        </button>
      </div>
    </div>
  }
</nav>
