<section #freshersSection id="freshers" class="py-24 bg-black relative overflow-hidden">
  
  <!-- Energetic Cinematic Background -->
  <div class="absolute inset-0 z-0 opacity-40">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-brand-gold/20 rounded-full blur-[120px] mix-blend-screen pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-brand-blue/30 rounded-full blur-[80px] pointer-events-none"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    
    <div class="flex flex-col md:flex-row justify-between items-end mb-16">
      <div class="max-w-2xl">
        <h4 class="text-brand-gold font-bold uppercase tracking-widest text-sm mb-3">Campus Vibe</h4>
        <h2 class="font-serif text-4xl md:text-5xl text-white font-bold">The <span class="text-brand-gold text-gradient-gold">Freshers</span> Experience</h2>
      </div>
      <p class="text-slate-400 max-w-sm text-sm mt-6 md:mt-0 leading-relaxed border-l-2 border-brand-gold/30 pl-4">
        A vibrant celebration of new beginnings. Feel the energy, youth, and cultural richness of our spectacular welcome events.
      </p>
    </div>

    <!-- Masonry-style Grid -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 auto-rows-[250px]">
      
      @for (img of partyImages; track img.id; let i = $index) {
        <div class="masonry-item relative rounded-3xl overflow-hidden cursor-pointer group shadow-2xl border border-white/10"
             [class.md:col-span-8]="img.size === 'large'"
             [class.md:col-span-4]="img.size === 'small'"
             [class.md:col-span-6]="img.size === 'medium'"
             [class.md:row-span-2]="img.size === 'large'"
             (click)="openLightbox(img)">
          
          <!-- Image -->
          <img [src]="img.url" 
               appImageFallback="https://placehold.co/800x600/1a1a1a/ffffff?text=Party+Moment"
               alt="Freshers Party Vibe" 
               class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out">
          
          <!-- Cinematic Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-60 group-hover:opacity-80 transition-opacity duration-300"></div>
          
          <!-- Hover Effects -->
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 transform scale-90 group-hover:scale-100">
            <div class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/40">
              <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
            </div>
          </div>
        </div>
      }

    </div>
  </div>

  <app-lightbox [isOpen]="isLightboxOpen" [mediaItem]="currentMedia" (close)="closeLightbox()"></app-lightbox>
</section>
