<div class="relative w-full h-screen min-h-[800px] flex items-center justify-center overflow-hidden bg-brand-blue">
  
  <!-- Cinematic Layered Background -->
  <div class="absolute inset-0 z-0">
    <!-- Image Background -->
    <div #heroBg 
         class="absolute inset-0 bg-cover bg-center bg-no-repeat" 
         [style.backgroundImage]="'url(' + heroImage + ')'">
    </div>
    
    <!-- Dark/Gradient Overlays for cinematic feel -->
    <div class="absolute inset-0 bg-brand-blue/60 mix-blend-multiply z-10"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-brand-blue via-transparent to-transparent z-10"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-brand-blue/90 via-brand-blue/40 to-transparent z-10"></div>
  </div>

  <!-- Hero Content -->
  <div #heroContent class="relative z-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
    <div class="max-w-3xl">
      <!-- Badge -->
      <div class="hero-stagger inline-flex items-center space-x-2 glassmorphism rounded-full px-4 py-1.5 mb-6 border-brand-gold/30">
        <span class="w-2 h-2 rounded-full bg-brand-gold animate-pulse"></span>
        <span class="text-xs font-sans text-brand-gold font-semibold uppercase tracking-wider">Admissions Open 2026-27</span>
      </div>
      
      <!-- Main Typography -->
      <h1 class="hero-stagger font-serif text-5xl md:text-7xl font-bold text-white leading-[1.1] mb-6">
        Excellence in <br />
        <span class="text-gradient-gold">JEE & NEET</span> <br />
        Preparation.
      </h1>
      
      <!-- Subtitle -->
      <p class="hero-stagger font-sans text-lg md:text-xl text-slate-200 mb-10 max-w-2xl leading-relaxed">
        BVC Akshar Junior College empowers future leaders with world-class faculty, premium facilities, and a proven track record in district ranks.
      </p>
      
      <!-- CTAs -->
      <div class="hero-stagger flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
        <!-- Primary CTA -->
        <button class="group relative px-8 py-4 bg-brand-gold text-brand-blue font-bold rounded-full overflow-hidden shadow-[0_0_20px_rgba(212,175,55,0.4)] hover:shadow-[0_0_30px_rgba(212,175,55,0.6)] transition-all duration-300">
          <div class="absolute inset-0 w-full h-full bg-white/20 scale-x-0 group-hover:scale-x-100 origin-left transition-transform duration-500 ease-out"></div>
          <span class="relative z-10 flex items-center justify-center uppercase tracking-wider text-sm">
            Apply Now
            <svg class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </span>
        </button>
        
        <!-- Secondary CTA -->
        <button (click)="scrollToSection('programs')" class="group px-8 py-4 glassmorphism-dark text-white font-semibold rounded-full hover:bg-white/20 transition-all duration-300 uppercase tracking-wider text-sm flex items-center justify-center">
          Explore Programs
        </button>
      </div>
    </div>
  </div>

  <!-- Scroll Down Indicator -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center cursor-pointer opacity-70 hover:opacity-100 transition-opacity" (click)="scrollToSection('leadership')">
    <span class="text-xs text-white uppercase tracking-widest mb-3 font-medium">Scroll</span>
    <div class="w-[1px] h-12 bg-white/30 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1/2 bg-brand-gold animate-[scrollDown_2s_ease-in-out_infinite]"></div>
    </div>
  </div>
</div>
